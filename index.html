<style id="lock-style">
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #060913 radial-gradient(ellipse at 50% 30%, #17143f 0%, #060913 65%); color: #e6eaf5; font: 15px/1.45 "Space Grotesk", system-ui, sans-serif; }
.checking .lock { visibility: hidden; }
.lock { width: min(380px, calc(100vw - 32px)); padding: 28px 24px 18px; border: 1px solid rgba(148,163,184,.2); border-radius: 18px; background: rgba(12,17,31,.85); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lock svg { width: 48px; height: 48px; filter: drop-shadow(0 0 12px rgba(139,92,246,.6)); }
.lock h1 { font-size: 22px; margin: 14px 0 4px; }
.lock p { margin: 0 0 18px; color: #8d97b2; }
.lock label { display: block; font-size: 13px; color: #8d97b2; margin: 12px 0 6px; }
.lock input[type=email], .lock input[type=password] { width: 100%; box-sizing: border-box; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(148,163,184,.3); background: #04070f; color: inherit; font: 16px "JetBrains Mono", ui-monospace, monospace; }
.lock input:focus-visible, .lock button:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 2px; }
.lock .row { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; color: #c7cde0; font-size: 14px; }
.lock .row input { width: 18px; height: 18px; }
.lock button { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid rgba(45,212,191,.6); background: rgba(45,212,191,.15); color: #e6fffb; font: inherit; font-weight: 600; cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: progress; }
.lock .err { min-height: 20px; margin: 10px 0 0; color: #fb7185; font-size: 14px; }
</style>
</head>
<body>
<form class="lock" id="lock">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#8b5cf6" d="M6 19 32 34v26L6 45z"/><path fill="#6d28d9" d="M32 34 58 19v26L32 60z"/><path fill="#2dd4bf" d="M32 4 58 19 32 34 6 19z"/></svg>
  <h1>Agent Office</h1>
  <p>Sign in to see your office.</p>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <label class="row"><input type="checkbox" id="remember" checked> Stay signed in on this device</label>
  <button type="submit" id="go">Sign in</button>
  <p class="err" id="err" role="alert"></p>
</form>

const REMEMBER = 'agent-office:remember';
const $ = (id) => document.getElementById(id);
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const safe = (fn, fallback = null) => { try { return fn(); } catch { return fallback; } };
// "Stay signed in" off keeps the session for this tab only
const target = () => (safe(() => localStorage.getItem(REMEMBER)) === '0' ? sessionStorage : localStorage);
const storage = {
  getItem: (k) => safe(() => localStorage.getItem(k) ?? sessionStorage.getItem(k)),
  setItem: (k, v) => safe(() => target().setItem(k, v)),
  removeItem: (k) => safe(() => { localStorage.removeItem(k); sessionStorage.removeItem(k); }),
};
const supabase = createClient(C.url, C.key, { auth: { storage, storageKey: 'agent-office-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

async function unlock() {
  const { data, error } = await supabase.from('office_site_keys').select('bundle_key').eq('id', P.id).maybeSingle();
  if (error) throw new Error('Couldn’t reach your office. Check your connection and try again.');
  if (!data) throw new Error('This copy of the page is out of date. Reload in a minute.');
  const key = await crypto.subtle.importKey('raw', fromB64(data.bundle_key), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(P.iv) }, key, fromB64(P.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function boot(app, session) {
  $('lock-style').remove();
  const style = document.createElement('style');
  style.textContent = app.css;
  document.head.append(style);
  document.documentElement.classList.remove('checking');
  document.body.innerHTML = app.body; // the office's own markup, from the encrypted bundle
  window.__officeCloud = { supabase, userId: session.user.id, email: session.user.email };
  const url = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const office = url(app.modules.office);
  const demo = url(app.modules.demo);
  const main = url(app.modules.main.replace("'./office.js'", JSON.stringify(office)).replace("'./demo.js'", JSON.stringify(demo)));
  await import(main);
}

function showLock(message) {
  document.documentElement.classList.remove('checking');
  if (message) $('err').textContent = message;
  ($('email').value ? $('pw') : $('email')).focus();
}

async function open(session) {
  const app = await unlock();
  try { await boot(app, session); } catch (err) {
    console.error(err);
    document.body.textContent = 'Signed in, but the office failed to load. Check your connection and reload.';
  }
}

$('lock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = $('go');
  $('err').textContent = '';
  go.disabled = true;
  go.textContent = 'Signing in…';
  safe(() => localStorage.setItem(REMEMBER, $('remember').checked ? '1' : '0'));
  const { data, error } = await supabase.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value.normalize('NFC') });
  if (error || !data.session) {
    $('err').textContent = /confirm/i.test(error?.message || '') ? 'Confirm your email first (check your inbox).' : 'Wrong email or password.';
    go.disabled = false;
    go.textContent = 'Sign in';
    $('pw').select();
    return;
  }
  try { await open(data.session); } catch (err) {
    $('err').textContent = err.message;
    go.disabled = false;
    go.textContent = 'Sign in';
  }
});

(async () => {
  const { data } = await supabase.auth.getSession();
  if (!data.session) { showLock(); return; }
  try { await open(data.session); } catch (err) { showLock(err.message); }
})();
</script>
